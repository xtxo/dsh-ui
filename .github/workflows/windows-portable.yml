name: Build Windows Portable

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/windows-portable.yml
      - .github/portable-rebuild.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js for build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release tag
        id: release_meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& node -p "require('./package.json').version").Trim()
          if (-not $version) { throw "package.json version is empty" }
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Portable target release: $tag"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install project dependencies
        shell: pwsh
        run: npm ci || npm install

      - name: Sync metadata and icons
        shell: pwsh
        run: npm run icons

      - name: Build Windows executable only
        shell: pwsh
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle

      - name: Assemble lightweight Portable package
        id: assemble
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exeCandidates = @(
            "src-tauri/target/x86_64-pc-windows-msvc/release/deepseek-harness.exe",
            "src-tauri/target/release/deepseek-harness.exe"
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exePath) { throw "Windows executable not found after Tauri build" }

          $portableDir = Join-Path $PWD "DeepSeek-Harness-Portable"
          Remove-Item $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          $portableExe = Join-Path $portableDir "DeepSeek-Harness.exe"
          Copy-Item $exePath $portableExe -Force
          Copy-Item $exePath (Join-Path $PWD "DeepSeek-Harness-Portable.exe") -Force

          @"
          DeepSeek Harness Desktop - Lightweight Portable

          1. Run DeepSeek-Harness.exe directly. No installation is required.
          2. If a compatible Node.js (22.19+ or 24+) is already installed, DSH-UI uses it.
          3. If Node.js is missing, DSH-UI downloads a verified portable Node.js runtime (~36 MB)
             to %LOCALAPPDATA%\dsh-ui\runtime on first launch only. No system install or admin rights.
          4. If @deepseek-ai/dsh is missing, DSH-UI starts it with npx and downloads/caches it on demand.
          5. Later launches reuse the downloaded runtime and npm cache.

          This package intentionally does NOT bundle node_modules, Node.js, or the DSH backend.
          That keeps the download small and avoids fragile deep node_modules ZIP extraction.
          "@ | Set-Content -Path (Join-Path $portableDir "README-FIRST-RUN.txt") -Encoding UTF8

          $zipPath = Join-Path $PWD "DeepSeek-Harness-Portable.zip"
          Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$portableDir\*" -DestinationPath $zipPath -CompressionLevel Optimal
          if (-not (Test-Path $zipPath)) { throw "Portable ZIP creation failed" }

          $zipItem = Get-Item $zipPath
          if ($zipItem.Length -lt 1MB) {
            throw "Portable ZIP is unexpectedly small: $($zipItem.Length) bytes"
          }

          # Regression check for the previous 'ZIP extracts empty' failure.
          $verifyDir = Join-Path $env:RUNNER_TEMP "portable-zip-verify"
          Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zipPath -DestinationPath $verifyDir -Force
          $verifiedExe = Join-Path $verifyDir "DeepSeek-Harness.exe"
          if (-not (Test-Path $verifiedExe)) {
            throw "Portable ZIP verification failed: DeepSeek-Harness.exe missing after extraction"
          }
          if ((Get-Item $verifiedExe).Length -lt 1MB) {
            throw "Portable ZIP verification failed: extracted executable is unexpectedly small"
          }

          $zipSizeMb = [math]::Round($zipItem.Length / 1MB, 1)
          $zipSha256 = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Lightweight Portable ZIP created: $zipSizeMb MB"
          Write-Host "Portable ZIP SHA256: $zipSha256"
          "zip_sha256=$zipSha256" >> $env:GITHUB_OUTPUT

      - name: Preserve Portable assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Portable-${{ steps.release_meta.outputs.tag }}
          path: |
            DeepSeek-Harness-Portable.zip
            DeepSeek-Harness-Portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload lightweight Portable assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Release $env:RELEASE_TAG does not exist"
          }

          gh release upload $env:RELEASE_TAG "DeepSeek-Harness-Portable.zip" "DeepSeek-Harness-Portable.exe" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload lightweight Portable assets"
          }

          $assetNames = @(gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($assetNames -notcontains "DeepSeek-Harness-Portable.zip") {
            throw "Portable ZIP is not visible in release assets after upload"
          }
          if ($assetNames -notcontains "DeepSeek-Harness-Portable.exe") {
            throw "Portable EXE is not visible in release assets after upload"
          }

          Write-Host "Lightweight Portable ZIP and EXE are present in release $env:RELEASE_TAG"
