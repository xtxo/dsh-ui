name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Sync release metadata and generate approved whale icons
        run: npm run icons

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_meta.outputs.tag }}
          releaseName: 'DeepSeek Harness Desktop ${{ steps.release_meta.outputs.tag }}'
          releaseBody: |
            ## 🚀 DeepSeek Harness Desktop Client Release

            ### 🌟 Highlights
            - **Little-whale app icon** across Windows, macOS, Linux and the system tray.
            - **Lightweight Windows installers**: use system Node.js/npx first; if missing, DSH-UI downloads a verified private Node.js runtime on first launch.
            - **Real DeepSeek Harness engine updates**: detects new `@deepseek-ai/dsh` releases, sends a native notification and can update the engine from inside DSH-UI.
            - **Self-contained Windows Portable ZIP**: includes Node.js, npm/npx and the DeepSeek Harness backend for clean machines.
            - **More reliable WebView2 setup**: Windows installers embed the Microsoft WebView2 bootstrapper.
            - **Version sync** keeps the client, tray, updater, README and website on the same release number.

            ### 📦 Downloads
            - **Windows Portable**: `.zip` (self-contained, unzip and run)
            - **Windows Installer**: `.exe` / `.msi` (smaller; smart runtime detection)
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `.dmg` (`aarch64`)
            - **macOS (Intel)**: `.dmg` (`x86_64`)
            - **Linux**: `.deb` / `.AppImage`

            ---
            *Powered by [tw93/Pake](https://github.com/tw93/Pake) & [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness)*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload self-contained Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/x86_64-pc-windows-msvc/release/deepseek-harness.exe"
          if (-not (Test-Path $exePath)) {
            $exePath = "src-tauri/target/release/deepseek-harness.exe"
          }
          if (-not (Test-Path $exePath)) {
            throw "Windows executable not found"
          }

          $portableDir = "DeepSeek-Harness-Portable"
          Remove-Item $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$portableDir/runtime/node/node_modules" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portableDir/server" | Out-Null

          Copy-Item $exePath "$portableDir/DeepSeek-Harness.exe" -Force

          # Include enough of the official Node distribution for both runtime use
          # and future in-app `npm install @deepseek-ai/dsh@latest` updates.
          $nodeExe = (Get-Command node).Source
          $nodeDir = Split-Path $nodeExe -Parent
          Copy-Item $nodeExe "$portableDir/runtime/node/node.exe" -Force
          Copy-Item "$nodeDir/npm.cmd" "$portableDir/runtime/node/npm.cmd" -Force
          Copy-Item "$nodeDir/npx.cmd" "$portableDir/runtime/node/npx.cmd" -Force
          Copy-Item "$nodeDir/node_modules/npm" "$portableDir/runtime/node/node_modules/npm" -Recurse -Force

          npm install --prefix "$portableDir/server" --omit=dev @deepseek-ai/dsh@latest

          if (-not (Test-Path "$portableDir/runtime/node/node.exe")) {
            throw "Portable Node runtime was not created"
          }
          if (-not (Test-Path "$portableDir/runtime/node/npm.cmd")) {
            throw "Portable npm runtime was not created"
          }
          if (-not (Test-Path "$portableDir/runtime/node/npx.cmd")) {
            throw "Portable npx runtime was not created"
          }
          if (-not (Test-Path "$portableDir/server/node_modules/@deepseek-ai/dsh/lib/bin.js")) {
            throw "Portable DeepSeek Harness server was not created"
          }

          $zipPath = "DeepSeek-Harness-Portable.zip"
          Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipPath -CompressionLevel Optimal
          gh release upload ${{ steps.release_meta.outputs.tag }} $zipPath --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
