name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          # macos-13 is retired on GitHub-hosted runners; keep Intel builds on the
          # supported Intel runner so x86_64 DMGs can still be repaired/released.
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Sync release metadata and generate approved whale icons
        run: npm run icons

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_meta.outputs.tag }}
          releaseName: 'DeepSeek Harness Desktop ${{ steps.release_meta.outputs.tag }}'
          releaseBody: |
            ## 🚀 DeepSeek Harness Desktop Client Release

            ### 🌟 Highlights
            - **Little-whale app icon** across Windows, macOS, Linux and the system tray.
            - **Lightweight Windows installers**: use system Node.js/npx first; if missing, DSH-UI downloads a verified private Node.js runtime on first launch.
            - **Real DeepSeek Harness engine updates**: detects new `@deepseek-ai/dsh` releases, sends a native notification and can update the engine from inside DSH-UI.
            - **Lightweight Windows Portable**: ships only the desktop client; Node.js and `@deepseek-ai/dsh` are downloaded and cached on demand when missing.
            - **More reliable WebView2 setup**: Windows installers embed the Microsoft WebView2 bootstrapper.
            - **Version sync** keeps the client, tray, updater, README and website on the same release number.

            ### 📦 Downloads
            - **Windows Portable**: `.zip` / standalone `.exe` (small online portable; missing runtime components are downloaded on first launch)
            - **Windows Installer**: `.exe` / `.msi` (smart runtime detection)
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `.dmg` (`aarch64`)
            - **macOS (Intel)**: `.dmg` (`x86_64`)
            - **Linux**: `.deb` / `.AppImage`

            ---
            *Powered by [tw93/Pake](https://github.com/tw93/Pake) & [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness)*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  portable-repair:
    if: >
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(portable): v')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Windows Portable workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run windows-portable.yml --repo "$GITHUB_REPOSITORY" --ref main
