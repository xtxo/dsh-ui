name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm install

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DeepSeek Harness Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 DeepSeek Harness Desktop Client Release

            ### 🌟 Features
            - **Ultra-lightweight**: ~8.7MB binary with native Rust + WebView2 / WebKit architecture.
            - **Zero manual backend setup**: Auto background engine management & smart local caching.
            - **DeepSeek brand styling**: Native system tray, drag-drop support, dark UI and shortcuts.

            ### 📦 Downloads
            - **Windows**: `.exe` / `.msi`
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `.dmg` (`aarch64`)
            - **macOS (Intel)**: `.dmg` (`x86_64`)
            - **Linux**: `.deb` / `.AppImage`

            ---
            *Powered by [tw93/Pake](https://github.com/tw93/Pake) & [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness)*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
