name: Sync Release Metadata

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - scripts/sync-version.mjs
      - .github/workflows/sync-release-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize version and release links
        run: node scripts/sync-version.mjs

      - name: Commit synchronized metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Release metadata already synchronized"
            exit 0
          fi

          VERSION="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md index.html website/index.html package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/src/app/setup.rs src-tauri/src/app/backend.rs
          git commit -m "chore(docs): sync release metadata for v${VERSION}"
          git push
